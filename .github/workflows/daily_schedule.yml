name: Daily Schedule Dispatcher

on:
  schedule:
    # 21:00 UTC = 00:00 по Московскому времени (UTC+3)
    - cron: '0 21 * * *'
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily schedule sender
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE: "Europe/Moscow"
          ANCHOR_DATE: "2026-10-12"
          ANCHOR_PARITY: "chislitel"
        run: |
          python send_tomorrow.py
