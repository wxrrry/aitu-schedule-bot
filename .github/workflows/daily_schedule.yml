name: Daily Schedule Dispatcher

on:
  schedule:
    # 21:00 UTC = 00:00 по Москве (полночная рассылка на завтра)
    - cron: '0 21 * * *'
    # 05:00 UTC = 08:00 по Москве (утреннее напоминание по будням)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      type:
        description: 'Тип рассылки'
        required: true
        default: 'midnight'
        type: choice
        options:
          - midnight
          - morning

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily schedule sender
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE: "Europe/Moscow"
          ANCHOR_DATE: "2026-10-12"
          ANCHOR_PARITY: "chislitel"
        run: |
          if [ "${{ github.event.inputs.type }}" = "morning" ] || [ "$(date -u +%H)" = "05" ]; then
            python send_tomorrow.py --morning
          else
            python send_tomorrow.py
          fi
