name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Запуск автоматического деплоя на VPS..."
            
            TARGET_DIR="/opt/aitu-schedule-bot"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Папка $TARGET_DIR не найдена. Сначала запустите setup_vps.sh на сервере!"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "📥 Получение свежих коммитов..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Проверка и обновление зависимостей Python..."
            ./venv/bin/pip install -r requirements.txt --quiet

            echo "🔄 Перезапуск службы aitu-bot..."
            if command -v sudo >/dev/null 2>&1; then
              sudo systemctl restart aitu-bot
              sudo systemctl is-active --quiet aitu-bot
            else
              systemctl restart aitu-bot
              systemctl is-active --quiet aitu-bot
            fi

            echo "✅ Бот успешно обновлен и запущен!"
