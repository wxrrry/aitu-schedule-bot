name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "🚀 Запуск автоматического деплоя на VPS..."
            
            TARGET_DIR="/opt/aitu-schedule-bot"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Папка $TARGET_DIR не найдена. Сначала запустите setup_vps.sh на сервере!"
              exit 1
            fi

            # Проверка и автоматическая настройка Swap 2G
            echo "💾 Проверка файла подкачки (Swap)..."
            if [ $(swapon --show | wc -l) -le 1 ]; then
              echo "⚡️ Создание и активация Swap (2 ГБ)..."
              SUDO=""
              if [ "$EUID" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              fi
              $SUDO fallocate -l 2G /swapfile || $SUDO dd if=/dev/zero of=/swapfile bs=1M count=2048
              $SUDO chmod 600 /swapfile
              $SUDO mkswap /swapfile
              $SUDO swapon /swapfile
              if ! grep -q "/swapfile" /etc/fstab; then
                echo '/swapfile none swap sw 0 0' | $SUDO tee -a /etc/fstab
              fi
              $SUDO sysctl -w vm.swappiness=20 || true
              $SUDO sysctl -w vm.vfs_cache_pressure=50 || true
              echo "vm.swappiness=20" | $SUDO tee /etc/sysctl.d/99-swap.conf || true
              echo "✅ Swap 2G успешно создан и активирован!"
            else
              echo "✅ Swap уже подключен:"
              swapon --show
            fi

            cd "$TARGET_DIR"
            echo "📥 Получение свежих коммитов..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Проверка и обновление зависимостей Python..."
            ./venv/bin/pip install -r requirements.txt --quiet

            echo "🔄 Перезапуск службы aitu-bot..."
            if command -v sudo >/dev/null 2>&1; then
              sudo systemctl restart aitu-bot
              sudo systemctl is-active --quiet aitu-bot
            else
              systemctl restart aitu-bot
              systemctl is-active --quiet aitu-bot
            fi

            echo "✅ Бот успешно обновлен и запущен!"
