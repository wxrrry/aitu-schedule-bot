<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>AITU // СЕТЬ КОЛЛЕДЖА</title>
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Telegram WebApp SDK: локальный файл для предотвращения блокировок РКН и мгновенной загрузки -->
    <script src="/telegram-web-app.js"></script>
    <script>
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) {
              if (k === 'aitu-hub-v1') caches.delete(k);
            });
          });
        }
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}
    </script>
    
    <!-- Fonts: Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#09090b] text-[#fafafa] antialiased selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
